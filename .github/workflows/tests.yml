# Exact companion source; no release, deployment, or onsite credentials.
name: Native Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uninus-nutriculture
    steps:
      - uses: actions/checkout@v4
        with:
          path: uninus-nutriculture
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ivanlee1007/uninus-nutriculture-card
          ref: 2499060e69b8e532f5d7d08dca768454dc68e7d0
          path: uninus-nutriculture-card
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt -r ../uninus-nutriculture-card/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Explicit native and browser environment
        run: |
          echo "P3A_CARD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "P3B_CARD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "BROWSER_EVIDENCE_DIR=$GITHUB_WORKSPACE/p3b-ci-evidence/browser" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/uninus-nutriculture:$GITHUB_WORKSPACE/uninus-nutriculture/tests" >> "$GITHUB_ENV"
      - name: Complete native regression with real shipped consumer
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p ../p3b-ci-evidence
          python -m pytest tests -v -s --basetemp ../p3b-ci-evidence/pytest --junitxml=../p3b-ci-evidence/native.xml | tee ../p3b-ci-evidence/native.log
      - name: Verify cases, companion bytes, and all six real terminal receipts
        run: |
          python - <<'PY'
          import hashlib, itertools, json, pathlib, re, xml.etree.ElementTree as E
          root = pathlib.Path('../p3b-ci-evidence')
          cases = list(E.parse(root/'native.xml').getroot().iter('testcase'))
          assert len(cases) == 295
          assert not any(c.find(k) is not None for c in cases for k in ('skipped','failure','error'))
          shipped = pathlib.Path('../uninus-nutriculture-card/uninus-nutriculture-card.js')
          expected = '4d6615afa83d736677fcf8f8791c695dcbd92b22b0e9d9aeeb731e2d75ab41bd'
          assert hashlib.sha256(shipped.read_bytes()).hexdigest() == expected
          receipts = {}
          for line in (root/'native.log').read_text().splitlines():
              match = re.search(r'\b(acid|mix) (aborted|fault|completed) (\{.*\})\s*$', line)
              if not match:
                  continue
              role, ending, payload = match.groups()
              receipt = json.loads(payload)
              assert receipt['page_errors'] == [] and receipt['shipped_sha256'] == expected
              captures = list((root/'pytest').rglob(role+'-'+ending+'.json'))
              assert len(captures) == 1
              assert hashlib.sha256(captures[0].read_bytes()).hexdigest() == receipt['native_sha256']
              key = role+'/'+ending
              assert key not in receipts
              receipts[key] = receipt
          assert set(receipts) == {r+'/'+e for r,e in itertools.product(('acid','mix'),('aborted','fault','completed'))}
          (root/'terminal-proof.json').write_text(json.dumps(receipts,indent=2))
          PY
      - run: python -m compileall -q custom_components tests
      - run: ruff check custom_components tests tools/evidence.py
      - run: ruff format --check custom_components tests tools/evidence.py
      - run: python tests/check.py --evidence ../p3b-ci-evidence/card
        working-directory: uninus-nutriculture-card
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3b-companion-native-evidence
          path: |
            p3b-ci-evidence/native.log
            p3b-ci-evidence/native.xml
            p3b-ci-evidence/terminal-proof.json
            p3b-ci-evidence/card/**
            !**/.storage/**
# No HACS/live-device acceptance, release, or deployment claim.
