# Exact companion source; no release, deployment, or onsite credentials.
name: Native Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: uninus-nutriculture
    steps:
      - uses: actions/checkout@v4
        with:
          path: uninus-nutriculture
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ivanlee1007/uninus-nutriculture-card
          ref: 2112c09f3b756a5b69aa8566c26ec32039b18a06
          path: uninus-nutriculture-card
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt -r requirements-history-test.txt -r ../uninus-nutriculture-card/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Export installed Chromium executable
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = Path(os.environ.get('CHROMIUM_EXECUTABLE') or p.chromium.executable_path)
              assert executable.is_file(), executable
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'CHROMIUM_EXECUTABLE={executable}\n')
          PY
      - name: Explicit native and browser environment
        run: |
          echo "P3A_CARD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "P3B_CARD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "P3C_CARD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          echo "P3C_CAPTURE_DIR=$GITHUB_WORKSPACE/uninus-nutriculture" >> "$GITHUB_ENV"
          echo "P3C_TERMINAL_ROOT=$GITHUB_WORKSPACE/uninus-nutriculture" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$GITHUB_WORKSPACE/p3c-ci-evidence/pycache" >> "$GITHUB_ENV"
          echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "BROWSER_EVIDENCE_DIR=$GITHUB_WORKSPACE/p3c-ci-evidence/browser" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/uninus-nutriculture:$GITHUB_WORKSPACE/uninus-nutriculture/tests" >> "$GITHUB_ENV"
      - name: P5c publication blocked until real reviewed Card commit exists
        run: |
          python - <<'PY'
          import hashlib,pathlib,re,subprocess
          text=pathlib.Path('.github/workflows/tests.yml').read_text()
          match=re.search(r'^          ref: ([0-9a-f]{40})$',text,re.M)
          assert match, 'P5C_PUBLICATION_BLOCKED: exact real reviewed Card commit required'
          pin=match.group(1)
          assert pin not in ('863406040b2537f57001caa0d59c56f16af97a67','0'*40), 'P5C_PUBLICATION_BLOCKED: parent must set the real reviewed P5c Card commit; baseline is not approval'
          card=pathlib.Path('../uninus-nutriculture-card')
          assert subprocess.check_output(['git','-C',str(card),'rev-parse','HEAD'],text=True).strip()==pin
          assert hashlib.sha256((card/'uninus-nutriculture-card.js').read_bytes()).hexdigest()=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          PY
      - name: P5b publication blocked until real reviewed Card commit exists
        run: |
          python - <<'PY'
          import hashlib,pathlib,re,subprocess
          text=pathlib.Path('.github/workflows/tests.yml').read_text()
          pin=re.search(r'^          ref: ([0-9a-f]{40})$',text,re.M).group(1)
          assert pin != '3eaa78c55043598fd4bc666c8ef432b8870d6701', 'P5B_PUBLICATION_BLOCKED: parent must replace baseline ref with the real reviewed P5b Card commit'
          assert pin != '0'*40
          card=pathlib.Path('../uninus-nutriculture-card')
          assert subprocess.check_output(['git','-C',str(card),'rev-parse','HEAD'],text=True).strip()==pin
          assert hashlib.sha256((card/'uninus-nutriculture-card.js').read_bytes()).hexdigest()=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          PY
      - name: P4b publication companion pin guard
        run: |
          python - <<'PY'
          import pathlib,re
          text=pathlib.Path('.github/workflows/tests.yml').read_text()
          pin=re.search(r'^          ref: ([0-9a-f]{40})$',text,re.M).group(1)
          assert pin != '108071a744ccc373c300d919b5741b1400a8a047', 'P4B_PUBLICATION_BLOCKED: parent must replace companion ref with real reviewed P4b Card commit'
          PY
      - name: P5a publication blocked until real reviewed Card commit exists
        run: |
          python - <<'PY'
          import hashlib,pathlib,re
          text=pathlib.Path('.github/workflows/tests.yml').read_text()
          pin=re.search(r'^          ref: ([0-9a-f]{40})$',text,re.M).group(1)
          assert pin != '127b6ee181b0a3b49cd16aa3ca1a3d79d020c6cf', 'P5A_PUBLICATION_BLOCKED: parent must first create the real reviewed P5a Card commit, then replace the literal companion ref'
          assert pin != '0'*40
          assert hashlib.sha256(pathlib.Path('../uninus-nutriculture-card/uninus-nutriculture-card.js').read_bytes()).hexdigest()=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          PY
      - name: P4c publication real companion pin and approved bundle guard
        run: |
          python - <<'PY'
          import hashlib,pathlib,re,subprocess
          text=pathlib.Path('.github/workflows/tests.yml').read_text()
          pin=re.search(r'^          ref: ([0-9a-f]{40})$',text,re.M).group(1)
          assert pin != '14dad5f2bed79baab52001bf47a8be80ffc5ff35', 'P4C_PUBLICATION_BLOCKED: parent must replace the historical P4b ref with the real reviewed P4c Card candidate commit'
          assert pin != '0'*40
          actual=subprocess.check_output(['git','-C','../uninus-nutriculture-card','rev-parse','HEAD'],text=True).strip()
          assert actual==pin
          assert hashlib.sha256(pathlib.Path('../uninus-nutriculture-card/uninus-nutriculture-card.js').read_bytes()).hexdigest()=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          PY
      - name: Require native bridge activation environment
        run: |
          python - <<'PY'
          import os,shutil
          for name in ('P3A_CARD_PYTHON','P3B_CARD_PYTHON','P3C_CARD_PYTHON','NODE'):
              assert os.environ.get(name) and shutil.which(os.environ[name]), name
          assert os.environ.get('PYTHONDONTWRITEBYTECODE')=='1'
          PY
      - name: Verify permanent suite collection
        run: python -m pytest tests --collect-only -q -p no:cacheprovider
      - name: Complete native regression with real shipped consumer
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p ../p3c-ci-evidence
          python -m pytest tests -v -s -p no:cacheprovider --basetemp ../p3c-ci-evidence/pytest --junitxml=../p3c-ci-evidence/native.xml | tee ../p3c-ci-evidence/native.log
      - name: Verify cases, companion bytes, and all six real terminal receipts
        run: |
          python - <<'PY'
          import hashlib, itertools, json, pathlib, re, os, xml.etree.ElementTree as E
          root = pathlib.Path(os.environ.get('CI_EVIDENCE_ROOT', '../p3c-ci-evidence'))
          cases = list(E.parse(root/'native.xml').getroot().iter('testcase'))
          assert len(cases) == 581
          assert len({c.attrib['classname'] for c in cases}) == 85
          assert not any(c.find(k) is not None for c in cases for k in ('skipped','failure','error'))
          shipped = pathlib.Path('../uninus-nutriculture-card/uninus-nutriculture-card.js')
          expected = '591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          assert hashlib.sha256(shipped.read_bytes()).hexdigest() == expected
          receipts = {}
          for line in (root/'native.log').read_text().splitlines():
              match = re.search(r'\b(acid|mix) (aborted|fault|completed) (\{.*\})\s*$', line)
              if not match:
                  continue
              role, ending, payload = match.groups()
              receipt = json.loads(payload)
              assert receipt['page_errors'] == [] and receipt['shipped_sha256'] == expected
              captures = list((root/os.environ.get('CI_PYTEST_DIR','pytest')).rglob(role+'-'+ending+'.json'))
              assert len(captures) == 1
              assert hashlib.sha256(captures[0].read_bytes()).hexdigest() == receipt['native_sha256']
              key = role+'/'+ending
              assert key not in receipts
              receipts[key] = receipt
          assert set(receipts) == {r+'/'+e for r,e in itertools.product(('acid','mix'),('aborted','fault','completed'))}
          (root/'terminal-proof.json').write_text(json.dumps(receipts,indent=2))
          PY
      - run: python -m compileall -q custom_components tests
      - run: ruff check --no-cache custom_components tests tools/evidence.py tools/p5a_*.py
      - run: ruff format --check --no-cache custom_components tests tools/evidence.py tools/p5a_*.py
      - run: python tests/check.py --evidence ../p3c-ci-evidence/card
        working-directory: uninus-nutriculture-card
      - name: Bidirectional shipped S5 and native Core join
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          P3C_JOIN_OUTPUT: ${{ github.workspace }}/p3c-ci-evidence/join
          P3C_TERMINAL_ROOT: ${{ github.workspace }}/uninus-nutriculture
        run: python -B tools/p3c_native_join.py attempt1 | tee ../p3c-ci-evidence/join-parent.log
      - name: Verify native S5 join results and current source binding
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os
          base=pathlib.Path.cwd(); root=pathlib.Path(os.environ.get('CI_EVIDENCE_ROOT', str(base.parent/'p3c-ci-evidence')))/os.environ.get('CI_JOIN_DIR','join'); run=root/'attempt1'
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          result=json.loads((run/'result.json').read_text()); wire=json.loads((run/'wire.json').read_text())
          assert result['exit_code']==0 and result['native_requests']==13 and len(wire)==13
          assert len([w for w in wire if w['request']['service']=='preview_flow_plan_v5'])==7
          done=[e for e in result['events'] if e.get('case')=='browser_done']; assert len(done)==1 and done[0]['page_errors']==[]
          errors=[w['reply'].get('error',{}) for w in wire if not w['reply']['success']]
          assert any('settings_conflict' in e.get('message','') for e in errors)
          assert any(e.get('message')=='Unauthorized' for e in errors)
          multi=json.loads((run/'multistage.json').read_text()); snap=multi['snapshot']; a=snap['states'][snap['status_id']]['attributes']
          assert all(x['result']=='completed' for x in a['step_runtime'].values())
          assert set(a['output_states'])=={'nutrient','acid','circulation','refill'} and all(v=='off' for v in a['output_states'].values())
          plans=[w for w in wire if w['request']['service']=='apply_flow_plan_v5']
          store=json.loads((run/'store-readback.json').read_text()); assert store['options']==plans[-1]['options']
          imported=json.loads((run/'actual-imports.json').read_text()); assert imported
          for name,row in imported.items():
              path=pathlib.Path(row['path']).resolve(); assert path.is_relative_to(base) or path.is_relative_to(root)
              assert h(path)==row['sha256']
              if name.startswith('custom_components.uninus_nutriculture'):
                  parts=path.parts; rel=pathlib.Path(*parts[parts.index('custom_components'):]); assert h(base/rel)==row['sha256']
              else:
                  source=base/'tests'/(name+'.py'); assert source.is_file() and h(source)==row['sha256']
          shipped=base.parent/'uninus-nutriculture-card/uninus-nutriculture-card.js'
          assert h(shipped)=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          terminals={e['terminal_source']:e['sha256'] for e in result['events'] if 'terminal_source' in e}
          assert len(terminals)==2
          for path,digest in terminals.items():
              p=pathlib.Path(path).resolve(); assert p.parent==base and h(p)==digest
          (root/'ci-verified.json').write_text(json.dumps({'native_requests':13,'native_previews':7,'imports':len(imported),'shipped_sha256':h(shipped),'terminal_sources':terminals,'four_completed_four_off':True},indent=2))
          PY
      - name: P4a native shipped Card recipe bridge
        env:
          P4A_JOIN_OUTPUT: ${{ github.workspace }}/p4a-ci-evidence/recipe
          P4A_CARD_PYTHON: python
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          base=pathlib.Path.cwd();root=pathlib.Path(os.environ['P4A_JOIN_OUTPUT']);root.mkdir(parents=True,exist_ok=True)
          from tools.p4b_quality_inputs import source_hashes
          paths=[base.parent/n for n in source_hashes(base)]
          (root/'source-before.json').write_text(json.dumps({p.relative_to(base.parent).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))
          PY
          python -B tools/p4a_recipe_native.py attempt1
      - name: Strict P4a activation and readback verification
        env:
          P4A_JOIN_OUTPUT: ${{ github.workspace }}/p4a-ci-evidence/recipe
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,importlib.metadata as metadata
          base=pathlib.Path.cwd(); root=pathlib.Path(os.environ['P4A_JOIN_OUTPUT']); run=root/'attempt1'
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          load=lambda n:json.loads((run/n).read_text())
          source_before=json.loads((root/'source-before.json').read_text());assert source_before
          for relative,digest in source_before.items():
           assert h(base.parent/relative)==digest
          source_before=json.loads((root/'source-before.json').read_text());assert source_before
          for relative,digest in source_before.items():
           assert h(base.parent/relative)==digest
          source_before=json.loads((root/'source-before.json').read_text());assert source_before
          for relative,digest in source_before.items():
           assert h(base.parent/relative)==digest
          assert metadata.version('homeassistant')=='2026.10.4'
          assert h(base.parent/'uninus-nutriculture-card/uninus-nutriculture-card.js')=='591eb021ebf0117d0cab48297603409807672c2b423c9eb15c7dd1ce384c670b'
          result=load('result.json'); wire=load('wire.json'); events=load('events.json')
          expected=['native_GET_empty_no_write','first_native_SAVE_checkpoint','Apply_ten_Numbers_S5_one_commit_preserve_nonrecipe_zero_IO','edit_catalog_only_and_Cancel_zero_mutation','same_name_distinct_native_UUIDs','second_delete_confirmation_only_then_native_delete','two_Cards_catalog_CAS_denial_draft_preserved','two_Cards_stale_settings_CAS_no_partial_write','native_active_admin_revoked_denial_and_no_target_metadata_read','SPEC01_native_ascii80_save_edit_select_apply_delete_history','SPEC01_native_astral80_save_edit_select_apply_delete_history','SPEC01_native_mixed80_save_edit_select_apply_delete_history','normal_STOP_fresh_SDK_process_full_options_catalog_and_parameters_readback']
          assert result['exit_code']==0 and result['native_requests']==28 and len(wire)==28
          assert [e['case'] for e in events]==expected and len(events)==13
          assert result['events'][:-1]==events and result['events'][-1]['case']=='browser_done' and result['events'][-1]['page_errors']==[]
          assert all(w['io']=={'refill':[],'dosing':[],'acid_on':False} for w in wire)
          assert wire[0]['commit_count']==0 and wire[1]['commit_count']==1 and wire[2]['commit_count']==2
          assert wire[2]['numbers']==events[1]['parameters']==events[2]['status']['parameters'] and len(wire[2]['numbers'])==10
          assert events[2]['status']['ready_for_irrigation'] is False
          for key in wire[1]['options']:
           if key not in ('parameters','recipe_catalog_v1','recipes_v1','settings_revision') and key in wire[2]['options']:
            # All non-recipe namespaces except settings revision must be preserved.
            if isinstance(wire[1]['options'][key],dict) and key not in ('recipe_catalog','recipes'):
             assert wire[1]['options'][key]==wire[2]['options'][key],key
          for index,message in [(9,'recipe_conflict'),(12,'settings_conflict'),(14,'Unauthorized')]:
           assert not wire[index]['reply']['success'] and message in wire[index]['reply']['error']['message']
           if index==12:
            assert wire[index]['options']==wire[index+1]['options'] and wire[index]['commit_count']==wire[index+1]['commit_count']==wire[index-1]['commit_count']+1
           else:
            assert wire[index]['options']==wire[index-1]['options'] and wire[index]['commit_count']==wire[index-1]['commit_count']
          assert load('protected-denial.json')=={'denied':'Unauthorized','target_reads':[]}
          fresh=load('stop-fresh-process-readback.json');assert fresh['options']==wire[-1]['options'] and fresh['effective_parameters']==wire[-1]['numbers'] and fresh['status_parameters']==wire[-1]['numbers'] and fresh['pid']>0
          imports=load('actual-imports.json');assert len(imports)==42
          for name,row in imports.items():
           p=pathlib.Path(row['path']).resolve();assert p.is_relative_to(base) or p.is_relative_to(root);assert h(p)==row['sha256']
           if name.startswith('custom_components.uninus_nutriculture'):
            parts=p.parts;source=base/pathlib.Path(*parts[parts.index('custom_components'):])
           else:source=base/'tests'/(name+'.py')
           assert source.is_file() and h(source)==row['sha256']
          (root/'ci-verified.json').write_text(json.dumps({'requests':28,'behavior_checkpoints':13,'imports':42,'zero_IO':True,'fresh_readback':True,'sdk':metadata.version('homeassistant')},indent=2))
          PY
      - name: P4b live quality native and shipped Card
        env:
          P4B_JOIN_OUTPUT: ${{ github.workspace }}/p4b-ci-evidence/live
          P4B_CARD_PYTHON: python
        run: python -B tools/p4b_quality_native.py attempt1
      - name: Verify activated P4b live source and safe receipts
        env:
          P4B_JOIN_OUTPUT: ${{ github.workspace }}/p4b-ci-evidence/live
        run: |
          python - <<'PY'
          import os,pathlib,subprocess,sys
          assert os.environ['P4B_JOIN_OUTPUT']
          subprocess.run([sys.executable,'-B','tools/p4c_legacy_verify.py','attempt1'],check=True)
          PY
      - name: Portable P4c real native Core and shipped Card join
        env:
          P4C_CARD_PYTHON: python
          P4C_JOIN_OUTPUT: ${{ github.workspace }}/p4c-ci-evidence/join
        run: python -B tools/p4c_native_join.py
      - name: Strict P4c result physical Store and source binding verification
        env:
          P4C_JOIN_OUTPUT: ${{ github.workspace }}/p4c-ci-evidence/join
        run: python -B tools/p4c_native_verify.py
      - name: Check portable P4c acceptance tooling
        run: |
          ruff check --no-cache --config pyproject.toml tools/p4c_*.py ../uninus-nutriculture-card/tests/check.py
          ruff format --check --no-cache --config pyproject.toml tools/p4c_*.py ../uninus-nutriculture-card/tests/check.py
      - name: Portable P5a default native visual acceptance and strict safe export
        env:
          P5A_CARD_PYTHON: python
          P5A_JOIN_OUTPUT: ${{ github.workspace }}/p5a-ci-evidence/visual
        run: |
          python -B tools/p5a_transport_regression.py
          python -B tools/p5a_visual_verify.py --run-default
      - name: P5b isolated selected-source native History then strict tiny safe export
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # Only this step retires legacy writer destinations; historical steps keep their contract.
          unset P3C_CAPTURE_DIR P3C_TERMINAL_ROOT P4B_JOIN_OUTPUT P5A_JOIN_OUTPUT
          export P5B_PAIR="$RUNNER_TEMP/p5b-source-pair"
          export P5B_OUT="$RUNNER_TEMP/p5b-native-runtime"
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          pair=pathlib.Path(os.environ['P5B_PAIR']).resolve()
          out=pathlib.Path(os.environ['P5B_OUT']).resolve()
          assert pair.parent==out.parent and pair!=out and not pair.exists() and not out.exists()
          pair.mkdir()
          hashes={}
          root_files={'.gitattributes','.gitignore','README.md','hacs.json','package.json','pyproject.toml','requirements-test.txt','requirements-history-test.txt','uninus-nutriculture-card.js','P3C_SPEC_FIX_AUTHENTICATION.json','P4A_BACKEND_FINAL.json'}
          for name in ('uninus-nutriculture','uninus-nutriculture-card'):
              repo=workspace/name
              tracked=subprocess.check_output(['git','-C',str(repo),'ls-files','-z']).decode().split('\0')
              for relative in filter(None,tracked):
                  rel=pathlib.PurePosixPath(relative)
                  assert not rel.is_absolute() and '..' not in rel.parts
                  if any(p in {'.git','.venv','__pycache__','.pytest_cache','.ruff_cache','node_modules','runtime','.storage','private-ha','test-results'} for p in rel.parts): continue
                  if rel.parts[:2]==('docs','evidence'): continue
                  if rel.parts[0] not in {'custom_components','tests','tools','.github','docs','demo'} and relative not in root_files: continue
                  source=repo.joinpath(*rel.parts); target=pair/name/rel
                  assert source.is_file() and not source.is_symlink() and source.resolve().is_relative_to(repo.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
                  sha=hashlib.sha256(source.read_bytes()).hexdigest()
                  assert hashlib.sha256(target.read_bytes()).hexdigest()==sha
                  hashes[name+'/'+relative]=sha
          for relative in ('uninus-nutriculture/tools/p5b_history_native.py','uninus-nutriculture/tools/p5b_history_verify.py','uninus-nutriculture-card/tests/p5b_history_browser.py','uninus-nutriculture-card/tests/p5b_history_native_browser.py','uninus-nutriculture-card/tests/p4a_capture.py','uninus-nutriculture-card/demo/index.html',*('uninus-nutriculture-card/tests/p4b_r2_capture/'+n for n in ('events.json','wire.json','grant.json'))):
              assert relative in hashes,relative
          (pair.parent/'p5b-selected-source.json').write_text(json.dumps(hashes,sort_keys=True,indent=2))
          PY
          python -B "$P5B_PAIR/uninus-nutriculture/tools/p5b_history_native.py" --source-pair "$P5B_PAIR" --out "$P5B_OUT" --card-python "$(command -v python)"
          python -B "$P5B_PAIR/uninus-nutriculture/tools/p5b_history_verify.py" --source-pair "$P5B_PAIR" --out "$P5B_OUT" --safe-export "$RUNNER_TEMP/p5b-safe-export/ci-verified.json"
      - name: P5c isolated native runtime trace then strict safe summary
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # Reuse the complete tracked source pair prepared by P5b, never its runtime.
          # All paths are fixed runner-owned locations, not untrusted event text.
          unset P3C_CAPTURE_DIR P3C_TERMINAL_ROOT P4B_JOIN_OUTPUT P5A_JOIN_OUTPUT
          export P5C_PAIR="$RUNNER_TEMP/p5b-source-pair"
          export P5C_OUT="$RUNNER_TEMP/p5c-native-private"
          export CARD_PYTHON="$(command -v python)"
          python - <<'PY'
          import hashlib,json,os,pathlib
          pair=pathlib.Path(os.environ['P5C_PAIR']).resolve()
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          out=pathlib.Path(os.environ['P5C_OUT']).resolve()
          assert pair.is_dir() and not out.exists() and pair.parent==out.parent
          hashes=json.loads((pair.parent/'p5b-selected-source.json').read_text())
