name: Native Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests -v
      - run: python -m compileall -q custom_components tests
      - run: ruff check custom_components tests tools/evidence.py
      - run: ruff format --check custom_components tests tools/evidence.py
# Private repository: intentionally no public HACS validation or release/deploy job.
